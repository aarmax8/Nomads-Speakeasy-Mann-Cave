<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&family=Special+Elite&display=swap');

:root{
  --gold:#C6A15B; --rust:#D2551E; --amber:#F0A83C; --chrome:#C7CBD1;
  --spk-display:'Playfair Display',Georgia,serif;
  --spk-body:'Cormorant Garamond',Georgia,serif;
  --mann-display:'Oswald','Arial Narrow',Impact,sans-serif;
  --mann-body:'Barlow Condensed','Arial Narrow',sans-serif;
  --stamp:'Special Elite','Courier New',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0a0b0c;color:#eee;font-family:var(--spk-body);-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}
button{cursor:pointer;border:0;background:none;color:inherit}
img{display:block}
.hide{display:none!important}

#root,.app{min-height:100%}
.app.speakeasy{background:radial-gradient(120% 90% at 50% -10%,#141b12 0%,#0a0d09 60%,#070907 100%);font-family:var(--spk-body)}
.app.mann{background:linear-gradient(180deg,#141518 0%,#0e0f11 100%);font-family:var(--mann-body)}
.wrap{max-width:480px;margin:0 auto;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));}

/* header */
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.brand-small{font-size:12px;letter-spacing:3px;text-transform:uppercase;opacity:.65}
.app.mann .brand-small{letter-spacing:1px;font-family:var(--mann-display)}
.app.speakeasy .brand-small{font-family:var(--spk-display);color:#9a958a}
.room-title{font-weight:700;font-size:22px;line-height:1}
.app.speakeasy .room-title{font-family:var(--spk-display);color:#EDE6D3}
.app.mann .room-title{font-family:var(--mann-display);text-transform:uppercase;letter-spacing:1px;color:#F1F3F6}

.pill,.chip{display:inline-flex;align-items:center;gap:8px;border-radius:4px;font-size:12px;
  letter-spacing:1px;text-transform:uppercase;font-weight:600;padding:9px 12px}
.app.speakeasy .pill{background:#1a2015;color:#EDE6D3;border:1px solid #C6A15B66}
.app.mann .pill{background:#22262b;color:#DDE0E4;border:1px solid #4a4f55}

.controls{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chip{flex:1;justify-content:center;font-weight:500;text-transform:none;letter-spacing:0;font-size:13px}
.app.speakeasy .chip{background:#141a10;color:#EDE6D3;border:1px solid #C6A15B55}
.app.mann .chip{background:#1c1f23;color:#DDE0E4;border:1px solid #43484e}
.chip.icononly{flex:0 0 auto;padding:9px 11px}

/* panels */
.panel{border-radius:8px;padding:14px;margin-bottom:12px}
.app.speakeasy .panel{background:#10150e;border:1px solid #C6A15B44}
.app.mann .panel{background:#17191c;border:2px solid #34383d}
.panel-title{font-weight:600;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.app.speakeasy .panel-title{font-family:var(--spk-display);color:var(--gold)}
.app.mann .panel-title{font-family:var(--mann-display);color:var(--rust)}
.searchbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.searchbar input{background:transparent;border:0;outline:none;color:inherit;width:100%;font-size:14px}
.list{display:grid;gap:6px;max-height:300px;overflow-y:auto}
.row{display:flex;align-items:center;justify-content:space-between;border-radius:4px;padding:10px 12px;
  font-size:15px;text-align:left;width:100%}
.app.speakeasy .row{background:#12170f;border:1px solid #3a3f34;color:#EDE6D3;font-family:var(--spk-body)}
.app.mann .row{background:#1a1c1f;border:1px solid #34383d;color:#DDE0E4;font-family:var(--mann-body)}
.row.active{border-color:var(--gold)}
.app.mann .row.active{border-color:var(--rust)}
.row-meta{font-size:12px;opacity:.7}
.app.speakeasy .row-meta{font-family:var(--spk-display)}
.app.mann .row-meta{font-family:var(--mann-display)}
.grp-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin:10px 0 5px}
.app.speakeasy .grp-label{color:var(--gold);font-family:var(--spk-display)}
.app.mann .grp-label{color:var(--rust);font-family:var(--mann-display)}
.togg{width:42px;height:24px;border-radius:20px;position:relative;flex:0 0 auto;transition:.2s;background:#3a3f34}
.togg.on{background:var(--gold)} .app.mann .togg.on{background:var(--rust)}
.togg span{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:20px;background:#fff;transition:.2s}
.togg.on span{left:20px}
.wide{width:100%;justify-content:center;margin-top:10px}

/* flip card */
.flip{perspective:1600px}
.flip-inner{position:relative;height:min(66vh,600px);transform-style:preserve-3d;
  transition:transform .65s cubic-bezier(.2,.7,.2,1)}
.flip-inner.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow-y:auto}
.face.back{transform:rotateY(180deg)}

/* speakeasy face */
.face-spk{border-radius:4px;padding:22px 22px 26px;color:#EDE6D3;font-family:var(--spk-body);
  background:linear-gradient(180deg,#12180F 0%,#0C110A 100%);border:1px solid #C6A15B55;
  box-shadow:inset 0 0 0 4px #0c110a, inset 0 0 0 5px #C6A15B33}
.spk-eyebrow{text-align:center;font-family:var(--spk-display);font-size:10px;letter-spacing:5px;
  text-transform:uppercase;color:var(--gold)}
.spk-pour{text-align:center;color:#C6A15B88;letter-spacing:3px;font-size:10px;margin-top:2px}
.spk-name{text-align:center;font-family:var(--spk-display);font-weight:600;font-size:34px;line-height:1.05;margin:12px 0 4px}
.spk-glass{text-align:center;font-style:italic;font-size:15px;color:#C9C0A7;margin-bottom:14px}
.spk-rule{height:1px;background:linear-gradient(90deg,transparent,#C6A15B77,transparent);margin-bottom:14px}
.spk-line{display:flex;align-items:baseline;gap:8px;font-size:18px;margin-bottom:6px}
.spk-line b{color:var(--gold);font-weight:400}
.spk-method{margin-top:14px;font-size:16px;line-height:1.5;color:#D8D0BA}
.spk-garnish{margin-top:10px;font-family:var(--spk-display);font-size:11px;letter-spacing:2px;
  text-transform:uppercase;color:var(--gold)}

/* mann face */
.face-mann{border-radius:6px;padding:16px;color:#DDE0E4;font-family:var(--mann-body);
  background:repeating-linear-gradient(180deg,#1a1c1f 0 2px,#191b1e 2px 4px);
  border:2px solid #34383d;box-shadow:0 0 0 4px #101113, inset 0 2px 8px #0008}
.mann-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mann-room{font-family:var(--mann-display);font-weight:700;font-size:12px;letter-spacing:2px;
  color:var(--chrome);text-transform:uppercase}
.mann-pour{font-family:var(--stamp);font-size:10px;color:var(--amber);border:1px solid var(--amber);
  padding:2px 6px;transform:rotate(-3deg)}
.art-frame{border:3px solid #3c4046;border-radius:4px;background:#0d0e10;
  box-shadow:inset 0 0 0 2px #14161a, 0 2px 6px #0009;padding:4px;margin-bottom:12px}
.art-inner{position:relative;height:150px;border-radius:2px;overflow:hidden;
  background:radial-gradient(120% 120% at 50% 0%,#26292e,#141518);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.art-img{width:100%;height:150px;object-fit:cover;border-radius:2px}
.art-hint{font-family:var(--stamp);font-size:10px;color:#7d848c;text-align:center;padding:0 8px}
.art-upload{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--stamp);
  font-size:11px;color:var(--amber);border:1px dashed #F0A83C88;padding:5px 10px;border-radius:3px}
.art-upload input{display:none}
.art-x{position:absolute;top:6px;right:6px;background:#000c;color:var(--chrome);
  border:1px solid #444;border-radius:4px;padding:5px}
.art-replace{position:absolute;bottom:6px;right:6px;background:#000c;color:var(--amber);
  border:1px solid #F0A83C66;border-radius:4px;padding:4px 8px;font-family:var(--stamp);font-size:10px;
  cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.art-replace input{display:none}
.mann-name{font-family:var(--mann-display);font-weight:700;font-size:30px;line-height:1;
  text-transform:uppercase;letter-spacing:1px;color:#F1F3F6}
.mann-glass{font-family:var(--stamp);font-size:12px;color:var(--rust);margin-bottom:10px}
.mann-rule{height:2px;background:repeating-linear-gradient(90deg,var(--rust) 0 10px,#3c4046 10px 16px);margin-bottom:10px}
.mann-line{display:flex;align-items:baseline;gap:8px;font-size:17px;margin-bottom:4px}
.mann-line b{color:var(--rust);font-family:var(--mann-display);font-weight:400}
.mann-method{margin-top:10px;font-size:15.5px;line-height:1.45;color:#C4C8CE}
.mann-garnish{margin-top:8px;font-family:var(--stamp);font-size:11px;color:var(--amber)}

/* contains chips */
.contains{margin-top:16px;padding-top:12px}
.face-spk .contains{border-top:1px solid #C6A15B44}
.face-mann .contains{border-top:1px solid #D2551E44}
.contains-h{font-size:10px;letter-spacing:2px;text-transform:uppercase;margin-bottom:7px}
.face-spk .contains-h{color:var(--gold);font-family:var(--spk-display)}
.face-mann .contains-h{color:var(--rust);font-family:var(--stamp)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.ingchip{font-size:12px;padding:4px 9px;border-radius:20px}
.face-spk .ingchip{background:#C6A15B22;border:1px solid #C6A15B66;color:#EDE6D3;font-family:var(--spk-body)}
.face-mann .ingchip{background:#D2551E22;border:1px solid #D2551E66;color:#DDE0E4;font-family:var(--stamp)}

/* nav */
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.navbtn{display:inline-flex;align-items:center;gap:4px;font-size:15px;letter-spacing:1px;text-transform:uppercase}
.app.speakeasy .navbtn{font-family:var(--spk-display);color:#EDE6D3}
.app.mann .navbtn{font-family:var(--mann-display);color:#DDE0E4}
.navbtn[disabled]{opacity:.32}
.counter{text-align:center;margin-top:8px;font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.6}
.app.speakeasy .counter{font-family:var(--spk-display)}
.app.mann .counter{font-family:var(--mann-display)}

/* empty */
.empty{border-radius:8px;padding:28px;text-align:center}
.app.speakeasy .empty{background:#10150e;border:1px solid #C6A15B44}
.app.mann .empty{background:#17191c;border:2px solid #34383d}
.empty h3{font-size:20px;margin:0 0 8px}
.app.speakeasy .empty h3{font-family:var(--spk-display)}
.app.mann .empty h3{font-family:var(--mann-display);text-transform:uppercase}
.empty p{opacity:.6;margin:0 0 16px}
.empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* entry */
.entry{min-height:100%;background:#0a0b0c;color:#eee;display:flex;flex-direction:column;justify-content:center;
  padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.entry-in{max-width:460px;margin:0 auto;width:100%}
.entry .est{text-align:center;font-family:var(--stamp);font-size:12px;letter-spacing:5px;color:var(--gold)}
.entry h1{text-align:center;font-family:var(--spk-display);font-weight:700;font-size:40px;line-height:1.02;margin:8px 0 4px}
.entry h1 .g{color:var(--gold)}
.entry .sub{text-align:center;color:#9a958a;font-style:italic;font-size:15px;margin-bottom:4px}
.entry .note{text-align:center;color:#6f6b62;font-size:12px;margin-bottom:26px}
.door{display:block;width:100%;text-align:left;padding:20px;border-radius:4px;margin-bottom:14px}
.door.spk{background:linear-gradient(180deg,#12180F,#0C110A);color:#EDE6D3;border:1px solid #C6A15B55;
  box-shadow:inset 0 0 0 4px #0c110a, inset 0 0 0 5px #C6A15B33}
.door.mann{background:repeating-linear-gradient(180deg,#1a1c1f 0 2px,#191b1e 2px 4px);color:#DDE0E4;
  border-radius:6px;border:2px solid #34383d;box-shadow:0 0 0 4px #101113}
.door .eyebrow{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:3px;text-transform:uppercase}
.door.spk .eyebrow{color:var(--gold);font-family:var(--spk-display)}
.door.mann .eyebrow{color:var(--amber);font-family:var(--mann-display);letter-spacing:2px}
.door .big{font-weight:700;font-size:26px;margin-top:4px}
.door.spk .big{font-family:var(--spk-display);font-weight:600}
.door.mann .big{font-family:var(--mann-display);text-transform:uppercase;letter-spacing:1px}
.door .d-sub{font-size:15px}
.door.spk .d-sub{color:#C9C0A7;font-style:italic}
.door.mann .d-sub{color:#B9BDC4;font-family:var(--mann-body)}
.entry .foot{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:22px;color:#5f5b53;font-size:12px}

svg{flex:0 0 auto}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------- icons ---------- */
function ic(n){
  const p={
    switch:'<path d="M8 3 4 7l4 4M4 7h13M16 21l4-4-4-4M20 17H7"/>',
    filter:'<path d="M3 5h18M6 12h12M10 19h4"/>',
    box:'<path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8"/>',
    left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 6l6 6-6 6"/>',
    flip:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',
    upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
    trash:'<path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14"/>',
    check:'<path d="M4 12l5 5L20 6"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>',
    wine:'<path d="M8 3h8l-1 7a3 3 0 0 1-6 0L8 3zM12 13v6M9 21h6"/>',
    flame:'<path d="M12 3s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s0 2 2 2c1.5 0 1.5-2 1-4-.5-2 1-6 1-6z"/>',
    door:'<path d="M4 21h16M6 21V4h9v17M13 12h.5"/>',
  }[n]||'';
  return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>';
}
function chopper(){
  return '<svg width="120" height="46" viewBox="0 0 120 46" fill="none" style="opacity:.5">'+
    '<circle cx="22" cy="34" r="10" stroke="#6b7178" stroke-width="2"/>'+
    '<circle cx="98" cy="34" r="10" stroke="#6b7178" stroke-width="2"/>'+
    '<path d="M22 34 L54 34 L66 20 L84 20 M54 34 L70 34 L98 34 M66 20 L60 12 L52 12 M84 20 L92 26" stroke="#8a9099" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<path d="M8 20 L20 18 L26 22" stroke="#8a9099" stroke-width="2" stroke-linecap="round"/></svg>';
}

/* ---------- ingredients ---------- */
const INGREDIENTS=[
  {id:'bourbon',label:'Bourbon',group:'Spirits'},
  {id:'rye',label:'Rye Whiskey',group:'Spirits'},
  {id:'tequila',label:'Tequila',group:'Spirits'},
  {id:'whiteRum',label:'White Rum',group:'Spirits'},
  {id:'darkRum',label:'Dark Rum',group:'Spirits'},
  {id:'gin',label:'Gin',group:'Spirits'},
  {id:'vodka',label:'Vodka',group:'Spirits'},
  {id:'brandy',label:'Cognac / Brandy',group:'Spirits'},
  {id:'sweetVermouth',label:'Sweet Vermouth',group:'Vermouth & Liqueur'},
  {id:'dryVermouth',label:'Dry Vermouth',group:'Vermouth & Liqueur'},
  {id:'orangeLiqueur',label:'Orange Liqueur',group:'Vermouth & Liqueur'},
  {id:'lime',label:'Fresh Lime Juice',group:'Juice & Syrup'},
  {id:'lemon',label:'Fresh Lemon Juice',group:'Juice & Syrup'},
  {id:'simple',label:'Simple Syrup',group:'Juice & Syrup'},
  {id:'agave',label:'Agave Nectar',group:'Juice & Syrup'},
  {id:'soda',label:'Soda Water',group:'Mixers'},
  {id:'gingerBeer',label:'Ginger Beer',group:'Mixers'},
  {id:'grapefruitSoda',label:'Grapefruit Soda',group:'Mixers'},
  {id:'angostura',label:'Angostura Bitters',group:'Bitters & More'},
  {id:'mint',label:'Fresh Mint',group:'Bitters & More'},
];
const LABEL=Object.fromEntries(INGREDIENTS.map(i=>[i.id,i.label]));
const GROUPS=['Spirits','Vermouth & Liqueur','Juice & Syrup','Mixers','Bitters & More'];

/* ---------- drinks (Campari-free) ---------- */
const DRINKS=[
 {id:'old-fashioned',name:'Old Fashioned',glass:'Rocks glass, big cube',core:['bourbon','simple','angostura'],
  spk:{pour:'Premium Pour',lines:["2 oz Michter's Small Batch Bourbon","¼ oz demerara syrup","3 dashes Angostura","1 dash orange bitters"],method:'Stir with one large cube until well chilled. Express an orange peel over the top.',garnish:'Orange peel · brandied cherry'},
  mann:{pour:'Well Pour',lines:['2 oz house bourbon','1 bar-spoon simple syrup','3 dashes Angostura'],method:'Build over ice, stir, drop an orange slice in. Done is done.',garnish:'Orange slice'}},
 {id:'manhattan',name:'Manhattan',glass:'Chilled coupe',core:['rye','sweetVermouth','angostura'],
  spk:{pour:'Premium Pour',lines:['2 oz Rittenhouse Rye','1 oz Carpano Antica sweet vermouth','2 dashes Angostura'],method:'Stir cold, strain up into a chilled coupe.',garnish:'Luxardo cherry'},
  mann:{pour:'Well Pour',lines:['2 oz well rye','1 oz sweet vermouth','2 dashes Angostura'],method:"Stir with ice, strain into whatever's clean.",garnish:'Bar cherry'}},
 {id:'whiskey-sour',name:'Whiskey Sour',glass:'Rocks or coupe',core:['bourbon','lemon','simple'],
  spk:{pour:'Premium Pour',lines:['2 oz Buffalo Trace Bourbon','¾ oz fresh lemon','¾ oz simple syrup','½ oz egg white'],method:'Dry shake, then shake with ice. Strain and float three drops of Angostura on the foam.',garnish:'Angostura dots · lemon twist'},
  mann:{pour:'Well Pour',lines:['2 oz house bourbon','1 oz fresh lemon','¾ oz simple syrup'],method:'Shake hard, pour over rocks.',garnish:'Lemon wedge'}},
 {id:'margarita',name:'Margarita',glass:'Rocks, salted rim',core:['tequila','orangeLiqueur','lime','agave'],
  spk:{pour:'Premium Pour',lines:['2 oz Espolòn Reposado','1 oz Cointreau','¾ oz fresh lime','¼ oz agave'],method:'Shake cold, strain over fresh ice on a half salt rim.',garnish:'Lime wheel · flaky salt'},
  mann:{pour:'Well Pour',lines:['2 oz well tequila','¾ oz triple sec','¾ oz fresh lime'],method:'Shake, pour, salt the rim. Send it.',garnish:'Lime wedge · salt'}},
 {id:'daiquiri',name:'Daiquiri',glass:'Chilled coupe',core:['whiteRum','lime','simple'],
  spk:{pour:'Premium Pour',lines:['2 oz Plantation 3 Stars Rum','¾ oz fresh lime','¾ oz simple syrup'],method:'Shake hard and fast, double-strain up.',garnish:'Lime wheel'},
  mann:{pour:'Well Pour',lines:['2 oz well white rum','1 oz fresh lime','¾ oz simple syrup'],method:'Shake with ice, strain up.',garnish:'Lime wheel'}},
 {id:'mojito',name:'Mojito',glass:'Highball',core:['whiteRum','lime','simple','mint','soda'],
  spk:{pour:'Premium Pour',lines:['2 oz Bacardí Reserva Ocho','¾ oz fresh lime','½ oz simple syrup','8 mint leaves','top soda'],method:'Gently press mint with syrup, add rum and lime over crushed ice, top with soda.',garnish:'Mint bouquet'},
  mann:{pour:'Well Pour',lines:['2 oz well white rum','¾ oz fresh lime','½ oz simple','mint','top soda'],method:'Muddle mint, build over ice, top soda, stir.',garnish:'Mint sprig'}},
 {id:'moscow-mule',name:'Moscow Mule',glass:'Copper mug',core:['vodka','lime','gingerBeer'],
  spk:{pour:'Premium Pour',lines:['2 oz Grey Goose Vodka','½ oz fresh lime','4 oz ginger beer'],method:'Build over pebble ice in a chilled copper mug.',garnish:'Lime wheel · candied ginger'},
  mann:{pour:'Well Pour',lines:['2 oz well vodka','½ oz lime','top ginger beer'],method:'Build over ice, squeeze the lime in.',garnish:'Lime wedge'}},
 {id:'tom-collins',name:'Tom Collins',glass:'Collins glass',core:['gin','lemon','simple','soda'],
  spk:{pour:'Premium Pour',lines:['2 oz Tanqueray No. Ten','1 oz fresh lemon','½ oz simple syrup','top soda'],method:'Shake the first three, strain over ice, lengthen with soda.',garnish:'Lemon wheel · cherry'},
  mann:{pour:'Well Pour',lines:['2 oz well gin','1 oz lemon','½ oz simple','top soda'],method:'Build tall over ice, top soda, stir once.',garnish:'Lemon wedge'}},
 {id:'martini',name:'Dry Martini',glass:'Chilled martini glass',core:['gin','dryVermouth'],
  spk:{pour:'Premium Pour',lines:["2½ oz Hendrick's Gin",'½ oz Dolin Dry Vermouth','orange bitters (optional)'],method:'Stir very cold, strain into a frozen glass.',garnish:'Lemon twist or olives'},
  mann:{pour:'Well Pour',lines:['2½ oz well gin','splash dry vermouth'],method:'Stir with ice, strain up.',garnish:'Olives'}},
 {id:'sidecar',name:'Sidecar',glass:'Coupe, sugar rim',core:['brandy','orangeLiqueur','lemon'],
  spk:{pour:'Premium Pour',lines:['2 oz Pierre Ferrand 1840 Cognac','¾ oz Cointreau','¾ oz fresh lemon'],method:'Shake cold, strain up onto a half sugar rim.',garnish:'Orange peel · sugar rim'},
  mann:{pour:'Well Pour',lines:['2 oz well brandy','¾ oz triple sec','¾ oz lemon'],method:"Shake, strain up. Sugar rim if you're feeling fancy.",garnish:'Sugar rim (optional)'}},
 {id:'dark-n-stormy',name:"Dark 'n' Stormy",glass:'Highball',core:['darkRum','gingerBeer','lime'],
  spk:{pour:'Premium Pour',lines:["2 oz Gosling's Black Seal Rum",'½ oz fresh lime','4 oz ginger beer'],method:'Build ginger beer over ice, float the dark rum on top for the storm cloud.',garnish:'Lime wedge'},
  mann:{pour:'Well Pour',lines:['2 oz dark rum','½ oz lime','top ginger beer'],method:'Build over ice, float the rum.',garnish:'Lime wedge'}},
 {id:'paloma',name:'Paloma',glass:'Highball, salted rim',core:['tequila','lime','grapefruitSoda'],
  spk:{pour:'Premium Pour',lines:['2 oz Espolòn Blanco','½ oz fresh lime','pinch salt','top Jarritos grapefruit'],method:'Build over ice, add a pinch of salt, top with grapefruit soda.',garnish:'Grapefruit wedge · salt rim'},
  mann:{pour:'Well Pour',lines:['2 oz well tequila','½ oz lime','top grapefruit soda'],method:'Build over ice, salt the rim, top and stir.',garnish:'Lime wedge · salt'}},
];

/* ---------- state + persistence ---------- */
const KEY='nmc.v1';
const defaults={bar:'speakeasy',entered:false,hideUnavailable:true,
  stock:Object.fromEntries(INGREDIENTS.map(i=>[i.id,true])),images:{}};
let saved={}; try{saved=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const state={...defaults,...saved,
  stock:{...defaults.stock,...(saved.stock||{})},images:{...(saved.images||{})},
  index:0,flipped:false,panel:null,filter:null,search:''};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(
  {bar:state.bar,entered:state.entered,hideUnavailable:state.hideUnavailable,stock:state.stock,images:state.images}));}catch(e){}}

const makeable=d=>d.core.every(id=>state.stock[id]);
function deck(){return DRINKS.filter(d=>(!state.filter||d.core.includes(state.filter))&&(!state.hideUnavailable||makeable(d)));}

/* ---------- repo image probing ---------- */
const repoCache={};
function findRepoImage(id,done){
  if(id in repoCache){done(repoCache[id]);return;}
  const exts=['jpg','jpeg','png','webp','JPG','PNG','JPEG'];let i=0;
  (function next(){
    if(i>=exts.length){repoCache[id]=false;done(false);return;}
    const path='images/'+id+'.'+exts[i++];
    const im=new Image();
    im.onload=()=>{repoCache[id]=path;done(path);};
    im.onerror=next; im.src=path;
  })();
}

/* ---------- render ---------- */
const root=document.getElementById('root');

function render(){
  const d=deck();
  if(state.index>d.length-1)state.index=Math.max(0,d.length-1);
  if(!state.entered){root.innerHTML=entryHTML();return;}
  const drink=d[state.index];
  const cnt=DRINKS.filter(makeable).length;
  const speak=state.bar==='speakeasy';
  root.innerHTML=
  '<div class="app '+(speak?'speakeasy':'mann')+'"><div class="wrap">'+
    '<div class="head"><div>'+
      '<div class="brand-small">Nomads Mann Cave</div>'+
      '<div class="room-title">'+(speak?'The Cellar':'The Mann Cave')+'</div>'+
    '</div>'+
    '<button class="pill" data-action="switch-bar" title="Switch rooms">'+ic('switch')+' Switch</button></div>'+

    '<div class="controls">'+
      '<button class="chip" data-action="open-filter">'+ic('filter')+' '+(state.filter?LABEL[state.filter]:'Filter')+'</button>'+
      '<button class="chip" data-action="open-stock">'+ic('box')+' Bar stock</button>'+
      (state.filter?'<button class="chip icononly" data-action="clear-filter" title="Clear filter">'+ic('x')+'</button>':'')+
    '</div>'+
    (state.panel==='filter'?filterPanel():'')+
    (state.panel==='stock'?stockPanel(cnt):'')+
    (drink?cardBlock(drink,d.length,speak,cnt):emptyBlock())+
  '</div></div>';

  if(drink){ hydrateArt(drink.id); }
}

function cardBlock(drink,total,speak,cnt){
  const frontIsSpk=speak;
  const front=frontIsSpk?spkFace(drink):mannFace(drink);
  const back=frontIsSpk?mannFace(drink):spkFace(drink);
  const flipLabel=state.flipped
    ?(speak?'Dive version':'House version')
    :(speak?'Well pour':'Top shelf');
  return '<div class="flip"><div class="flip-inner'+(state.flipped?' flipped':'')+'">'+
      '<div class="face front">'+front+'</div>'+
      '<div class="face back">'+back+'</div>'+
    '</div></div>'+
    '<div class="nav">'+
      '<button class="navbtn" data-action="prev"'+(state.index===0?' disabled':'')+'>'+ic('left')+' Prev</button>'+
      '<button class="pill" data-action="flip">'+ic('flip')+' '+flipLabel+'</button>'+
      '<button class="navbtn" data-action="next"'+(state.index===total-1?' disabled':'')+'>Next '+ic('right')+'</button>'+
    '</div>'+
    '<div class="counter">'+(state.index+1)+' of '+total+' pouring · '+cnt+' makeable tonight</div>';
}

function containsRow(drink){
  return '<div class="contains"><div class="contains-h">Tap to find every drink with —</div><div class="chips">'+
    drink.core.map(id=>'<button class="ingchip" data-action="pick" data-id="'+id+'">'+LABEL[id]+'</button>').join('')+
    '</div></div>';
}
function spkFace(drink){
  return '<div class="face-spk">'+
    '<div class="spk-eyebrow">The Cellar</div>'+
    '<div class="spk-pour">⸻ '+drink.spk.pour+' ⸻</div>'+
    '<h2 class="spk-name">'+drink.name+'</h2>'+
    '<div class="spk-glass">'+drink.glass+'</div><div class="spk-rule"></div>'+
    drink.spk.lines.map(l=>'<div class="spk-line"><b>◦</b><span>'+l+'</span></div>').join('')+
    '<p class="spk-method">'+drink.spk.method+'</p>'+
    '<p class="spk-garnish">Garnish — '+drink.spk.garnish+'</p>'+
    containsRow(drink)+'</div>';
}
function mannFace(drink){
  return '<div class="face-mann">'+
    '<div class="mann-top"><span class="mann-room">The Mann Cave</span>'+
      '<span class="mann-pour">'+drink.mann.pour+'</span></div>'+
    '<div class="art-frame"><div class="art-inner" id="art-'+drink.id+'">'+artInner(drink)+'</div></div>'+
    '<h2 class="mann-name">'+drink.name+'</h2>'+
    '<div class="mann-glass">'+drink.glass+'</div><div class="mann-rule"></div>'+
    drink.mann.lines.map(l=>'<div class="mann-line"><b>▸</b><span>'+l+'</span></div>').join('')+
    '<p class="mann-method">'+drink.mann.method+'</p>'+
    '<p class="mann-garnish">GARNISH: '+drink.mann.garnish+'</p>'+
    containsRow(drink)+'</div>';
}
function artInner(drink){
  const up=state.images[drink.id];
  if(up){
    return '<img class="art-img" src="'+up+'" alt="">'+
      '<button class="art-x" data-action="remove-image" data-id="'+drink.id+'" title="Remove art">'+ic('trash')+'</button>'+
      '<label class="art-replace">'+ic('upload')+' Replace<input type="file" accept="image/*" data-upload="'+drink.id+'"></label>';
  }
  return chopper()+
    '<div class="art-hint">Drop <b>images/'+drink.id+'.jpg</b> in your repo — it fills here automatically</div>'+
    '<label class="art-upload">'+ic('upload')+' Add David Mann art<input type="file" accept="image/*" data-upload="'+drink.id+'"></label>';
}
function hydrateArt(id){
  if(state.images[id])return;               // uploaded image wins
  findRepoImage(id,path=>{
    if(!path)return;
    const el=document.getElementById('art-'+id);
    if(!el)return;
    el.innerHTML='<img class="art-img" src="'+path+'" alt="">'+
      '<label class="art-replace">'+ic('upload')+' Replace<input type="file" accept="image/*" data-upload="'+id+'"></label>';
  });
}

function filterPanel(){
  const rows=INGREDIENTS.filter(i=>i.label.toLowerCase().includes(state.search.toLowerCase()));
  const count=id=>DRINKS.filter(d=>d.core.includes(id)&&(!state.hideUnavailable||makeable(d))).length;
  return '<div class="panel"><div class="panel-title">Filter by ingredient</div>'+
    '<div class="chip searchbar">'+ic('search')+
      '<input placeholder="Search ingredients" value="'+state.search.replace(/"/g,'&quot;')+'" data-search></div>'+
    '<div class="list">'+rows.map(i=>{const c=count(i.id);
      return '<button class="row'+(state.filter===i.id?' active':'')+'" data-action="pick" data-id="'+i.id+'"'+(c===0?' disabled style="opacity:.4"':'')+'>'+
        '<span>'+i.label+'</span><span class="row-meta">'+c+' drink'+(c===1?'':'s')+'</span></button>';}).join('')+'</div>'+
    (state.filter?'<button class="chip wide" data-action="clear-filter">'+ic('x')+' Clear filter</button>':'')+
    '</div>';
}
function stockPanel(cnt){
  let html='<div class="panel"><div class="panel-title">What\'s behind the bar</div>'+
    '<div class="row" style="margin-bottom:10px"><span>Only show drinks I can make</span>'+
      '<span class="togg'+(state.hideUnavailable?' on':'')+'" data-action="toggle-hide"><span></span></span></div>'+
    '<div class="grp-label" style="margin-top:0">'+cnt+' of '+DRINKS.length+' drinks makeable</div>'+
    '<div class="list">';
  GROUPS.forEach(g=>{
    html+='<div class="grp-label">'+g+'</div>';
    INGREDIENTS.filter(i=>i.group===g).forEach(i=>{
      const on=state.stock[i.id];
      html+='<button class="row" data-action="toggle-stock" data-id="'+i.id+'" style="opacity:'+(on?1:.5)+'">'+
        '<span>'+i.label+'</span><span class="row-meta" style="display:flex;align-items:center;gap:4px">'+
        (on?ic('check'):ic('x'))+(on?'In stock':'Out')+'</span></button>';
    });
  });
  html+='</div><button class="chip wide" data-action="reset-stock">Mark everything in stock</button></div>';
  return html;
}
function emptyBlock(){
  return '<div class="empty"><h3>Nothing pouring right now</h3>'+
    '<p>'+(state.filter?'No in-stock drinks use '+LABEL[state.filter]+'.':"You're out of too many ingredients.")+'</p>'+
    '<div class="btns">'+
      (state.filter?'<button class="chip" data-action="clear-filter">Clear filter</button>':'')+
      '<button class="chip" data-action="show-all">Show everything anyway</button></div></div>';
}
function entryHTML(){
  return '<div class="entry"><div class="entry-in">'+
    '<div class="est">ESTABLISHED FOR THE ROAD</div>'+
    '<h1>Nomads<br><span class="g">Mann Cave</span></h1>'+
    '<p class="sub">One venue, two rooms. Pick your door.</p>'+
    '<p class="note">Art wall in the Cave fills from your images/ folder — David Mann, your scans.</p>'+
    '<button class="door spk" data-action="enter-spk"><span class="eyebrow">'+ic('wine')+' The Cellar</span>'+
      '<div class="big">The Speakeasy</div><div class="d-sub">Top-shelf pours. Stirred slow.</div></button>'+
    '<button class="door mann" data-action="enter-mann"><span class="eyebrow">'+ic('flame')+' The Mann Cave</span>'+
      '<div class="big">The Dive Bar</div><div class="d-sub">Well spirits. Chrome &amp; throttle.</div></button>'+
    '<div class="foot">'+ic('door')+' You can switch rooms any time inside.</div>'+
  '</div></div>';
}

/* ---------- events (delegated once) ---------- */
root.addEventListener('click',e=>{
  const t=e.target.closest('[data-action]'); if(!t)return;
  const a=t.dataset.action, id=t.dataset.id;
  switch(a){
    case 'enter-spk': state.bar='speakeasy'; state.entered=true; persist(); render(); break;
    case 'enter-mann': state.bar='mann'; state.entered=true; persist(); render(); break;
    case 'switch-bar': state.bar=state.bar==='speakeasy'?'mann':'speakeasy'; state.flipped=false; persist(); render(); break;
    case 'open-filter': state.panel=state.panel==='filter'?null:'filter'; render(); break;
    case 'open-stock': state.panel=state.panel==='stock'?null:'stock'; render(); break;
    case 'clear-filter': state.filter=null; state.index=0; state.flipped=false; state.panel=null; render(); break;
    case 'pick': state.filter=id; state.index=0; state.flipped=false; state.panel=null; render(); break;
    case 'prev': if(state.index>0){state.index--;state.flipped=false;render();} break;
    case 'next': { const n=deck().length; if(state.index<n-1){state.index++;state.flipped=false;render();} } break;
    case 'flip': {
      state.flipped=!state.flipped;
      const inner=root.querySelector('.flip-inner');
      if(inner)inner.classList.toggle('flipped',state.flipped);
      const speak=state.bar==='speakeasy';
      t.innerHTML=ic('flip')+' '+(state.flipped?(speak?'Dive version':'House version'):(speak?'Well pour':'Top shelf'));
    } break;
    case 'toggle-hide': state.hideUnavailable=!state.hideUnavailable; state.index=0; state.flipped=false; persist(); render(); break;
    case 'toggle-stock': state.stock[id]=!state.stock[id]; state.flipped=false; persist(); render(); break;
    case 'reset-stock': INGREDIENTS.forEach(i=>state.stock[i.id]=true); persist(); render(); break;
    case 'show-all': state.hideUnavailable=false; persist(); render(); break;
    case 'remove-image': delete state.images[id]; delete repoCache[id]; persist(); render(); break;
  }
});
root.addEventListener('input',e=>{
  if(e.target.matches('[data-search]')){ state.search=e.target.value; const pos=e.target.selectionStart;
    render(); const box=root.querySelector('[data-search]'); if(box){box.focus();try{box.setSelectionRange(pos,pos)}catch(_){}} }
});
root.addEventListener('change',e=>{
  const inp=e.target.closest('[data-upload]'); if(!inp)return;
  const f=inp.files&&inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ state.images[inp.dataset.upload]=r.result; persist(); render(); };
  r.readAsDataURL(f);
});

render();
</script>
</body>
</html>
