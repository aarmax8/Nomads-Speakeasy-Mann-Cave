function parseIngredient(line){ let name=line.replace(/^[\d./\s-]+(oz|dashes|dash)\s*/i,''); const phrases=['Fill a tall glass with ','Fill with ','Top with ','Float the ','Splash of ','Splash ','Dash of ']; for(const p of phrases){ if(name.toLowerCase().startsWith(p.toLowerCase())){ name=name.substring(p.length); const i=name.toLowerCase().indexOf(' in a'); if(i>-1)name=name.substring(0,i); const j=name.toLowerCase().indexOf(' on top'); if(j>-1)name=name.substring(0,j); break; } } name=name.replace(/,\s*\d+\s*dashes?$/i,'').trim(); return ALL_INGREDIENTS.includes(name)?name:null; }
function allIngredientsOf(d){ const out=[]; d.recipe.forEach(line=>{ const n=parseIngredient(line); if(n)out.push(n); }); return out; }
MENU.forEach(d=>{ const text=(d.recipe.join(' ')+' '+(d.pours||[]).map(p=>p.slot).join(' ')).toLowerCase(); const cats=new Set(); if(/orange juice|pineapple juice|cranberry juice|sour mix|black coffee|hot water/.test(text))cats.add('Brunch'); if(/club soda|tonic water|sprite|iced tea/.test(text))cats.add('Lunch'); if(/cola/.test(text))cats.add('Dinner'); const dessert=d.pours&&d.pours.some(p=>p.picks.some(k=>/Baileys|Kahlúa|Amaretto|Butterscotch|Root Beer/.test(k.n))); if(dessert)cats.add('Dessert'); if(cats.size===0)cats.add('Dinner'); d.category=Array.from(cats); const fams=new Set(); if(d.pours)d.pours.forEach(p=>p.picks.forEach(k=>{ if(SPIRIT_FAMILY[k.n])fams.add(SPIRIT_FAMILY[k.n]); })); d.recipe.forEach(l=>{ const n=parseIngredient(l); if(n&&SPIRIT_FAMILY[n])fams.add(SPIRIT_FAMILY[n]); }); d.families=Array.from(fams); d.fixedIngredients=allIngredientsOf(d); });

function isMakeable(d){ if(d.isBarcode)return true; if(!d.fixedIngredients.every(inStock))return false; return (d.pours||[]).every(p=>p.picks.some(k=>inStock(k.n))); }

eat"},"Amaretto Sour":{type:"shot",glass:"Shot Glass",method:"Shaken & Served Neat"},"B-52":{type:"shooter",glass:"Shooter Glass",method:"Slowly Layered"},"Buttery Nipple":{type:"shooter",glass:"Shooter Glass",method:"Layered"},"Surfer on Acid":{type:"shot",glass:"Shot Glass",method:"Shaken & Served Neat"},"Long Island":{type:"tall",glass:"Collins Glass",method:"Built & Topped"},"Adios":{type:"tall",glass:"Collins Glass",method:"Built & Topped"},"Shirley Temple":{type:"tall",glass:"Highball Glass",method:"Built in Glass"},"Roy Rogers":{type:"tall",glass:"Highball Glass",method:"Built in Glass"}};
function getServeSpec(d){ return SERVE_OVERRIDES[d.name]||{glass:"Rocks Glass",method:"Stirred & Strained",type:"short"}; }
function drinkArt(d){ const t=getServeSpec(d).type; const c=DRINK_COLOR[d.name]||'#b5762a'; const S='stroke="#d4af37" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"'; const L='fill="'+c+'" fill-opacity="0.6"'; let g=''; if(t==='up'){ g='<path d="M30 40 L90 40 L60 78 Z" '+L+'/><path d="M26 40 L94 40 L60 82 Z" '+S+'/><line x1="60" y1="82" x2="60" y2="106" '+S+'/><line x1="42" y1="108" x2="78" y2="108" '+S+'/>'; }else if(t==='tall'){ g='<path d="M48 30 L72 30 L70 110 Q60 114 50 110 Z" '+L+'/><rect x="46" y="26" width="28" height="88" rx="4" '+S+'/>'; }else if(t==='shot'||t==='shooter'){ g='<path d="M45 48 L75 48 L72 92 Q60 96 48 92 Z" '+L+'/><path d="M45 46 L75 46 L72 94 Q60 98 48 94 Z" '+S+'/>'; }else if(t==='warm'){ g='<path d="M40 48 L78 48 L75 98 Q59 102 43 98 Z" '+L+'/><path d="M40 46 L78 46 L75 100 Q59 104 43 100 Z" '+S+'/><path d="M78 56 Q98 60 96 82 Q94 100 78 96" '+S+'/>'; }else{ g='<path d="M41 50 L79 50 L76 100 Q60 104 44 100 Z" '+L+'/><path d="M41 48 L79 48 L76 102 Q60 106 44 102 Z" '+S+'/>'; } return '<svg viewBox="0 0 120 120" width="92" height="92" aria-hidden="true">'+g+'</svg>'; }
function recipeLine(line){ const name=parseIngredient(line); const ic=iconFor(name||line); const icon=ic[0],color=ic[1]; const missing=name&&!inStock(name); const match=line.match(/^([\d./\-]+\s*(?:oz|dashes|dash|drops|drop|tbsp|tsp|splash|Fill with|Fill a tall glass with|Top with|Float the)?)\s*(.*)$/i); let measure="",ingredientText=line; if(match){ measure=match[1].trim(); ingredientText=match[2].trim(); } return '<li class="'+(missing?'is-missing opacity-30 line-through':'')+'"><div class="recipe-item-left"><i class="fas '+icon+' text-[0.8rem] flex-shrink-0" style="color:'+color+'"></i><span class="font-normal text-gray-200 tracking-wide text-[1rem]">'+ingredientText+'</span></div>'+(measure?'<span class="recipe-item-measure">'+measure+'</span>':'')+'</li>'; }
function pourRecipeBlock(d){ if(!d.pours||!d.pours.length)return ''; const groups=d.pours.map(p=>{ const picks=p.picks.map((k,i)=>{ const out=!inStock(k.n); const cls=out?'is-out':(i===0?'is-top':''); const star=(i===0&&!out)?'\u2605 ':''; return '<li class="pour-pick '+cls+'">'+star+k.n+'<span class="why">'+k.why+'</span></li>'; }).join(''); return '<div class="pour-group"><span class="pour-slot-label">'+p.slot+'</span><ul class="pour-pick-list">'+picks+'</ul></div>'; }).join(''); return '<div class="recipe-pours">'+groups+'</div>'; }
function buildTOC(){ const groups=[{title:"Whiskey & Bourbon",families:["Whiskey & Bourbon"]},{title:"Vodka",families:["Vodka"]},{title:"Gin",families:["Gin"]},{title:"Rum",families:["Rum"]},{title:"Agave & Tequila",families:["Tequila"]},{title:"Brandy & Liqueurs",families:["Brandy","Liqueurs & Schnapps","Other"]},{title:"Zero Proof",families:["Zero Proof","None"]}]; let html=''; groups.forEach(group=>{ const items=CARDS.map((c,index)=>({c,index})).filter(({c})=>{ if(c.isBarcode)return false; if(group.title==="Zero Proof"&&c.families.length===0)return true; if(c.families.length===0)return false; const pf=c.families[0]; return group.families.includes(pf)||(group.title==="Brandy & Liqueurs"&&!["Whiskey & Bourbon","Vodka","Gin","Rum","Tequila"].includes(pf)); }); if(items.length>0){ html+='<div class="toc-category-header">'+group.title+'</div><div class="grid grid-cols-2 gap-1.5 mb-3">'+items.map(({c,index})=>'<div class="toc-item" data-goto="'+index+'">'+c.name+'</div>').join('')+'</div>'; } }); return html; }
function cardHTML(d,idx){ if(d.isBarcode){ return '<div class="drink-card" data-idx="'+idx+'" data-is-barcode="true" data-name="'+d.name+'"><div class="drink-card-inner"><div class="drink-card-front"><h3 class="drink-card-title">The Menu</h3><img src="'+d.image+'" alt="QR" onerror="this.style.display=\'none\'"><div class="card-spec-tagline" style="border:none">Tap this card for the full list</div><div style="color:#d4af37;font-family:\'Cormorant Garamond\',serif;font-size:0.95rem;font-style:italic">Swipe left to browse drinks</div><div class="aarmax8-brand-badge">NOMADS</div></div><div class="drink-card-back no-image"><div class="barcode-back-content">'+buildTOC()+'</div><div class="aarmax8-back-watermark">DILLIGAF</div></div></div></div>'; } const fav=favorites.includes(d.name); const photo=photos[d.name]||d.defaultPhoto||''; const bg=photo?"--bg-image:url('"+photo+"')":''; const spec=getServeSpec(d); const back='<div class="drink-card-back '+(photo?'':'no-image')+'" style="'+bg+'">'+(photo?'<button class="photo-clear" data-clear="'+d.name+'">\u2715 Photo</button>':'<label class="photo-slot"><i class="fas fa-camera"></i> Add a photo<input type="file" accept="image/*" data-photo="'+d.name+'" hidden></label>')+'<div class="card-back-content"><p class="story-text">'+d.story+'</p></div><div class="card-footer-back"><span class="card-hook-text">"'+d.hook+'"</span></div><div class="aarmax8-back-watermark">DILLIGAF</div></div>'; return '<div class="drink-card '+(isMakeable(d)?'':'is-unavailable')+'" data-idx="'+idx+'" data-name="'+d.name+'"><div class="drink-card-inner"><div class="drink-card-front"><div class="card-header-front"><h3 class="drink-card-title">'+d.name+'</h3>'+(d.style?'<div class="drink-card-subtitle">'+d.style+'</div>':'')+'<button class="favorite-btn '+(fav?'is-favorite':'')+'" data-fav="'+d.name+'" aria-label="Favorite"><i class="fas fa-heart"></i></button></div><div class="recipe-content"><div class="drink-art">'+drinkArt(d)+'</div><ul class="recipe-list-front">'+d.recipe.map(recipeLine).join('')+'</ul>'+pourRecipeBlock(d)+'</div><div class="card-spec-tagline">Serve: '+spec.glass+' &bull; '+spec.method+'</div><div class="aarmax8-brand-badge">NOMADS</div></div>'+back+'</div></div>'; }
function visibleCards(){ return CARDS.filter(d=>{ if(d.isBarcode)return true; if(!isMakeable(d))return false; if(filters.favesOnly&&!favorites.includes(d.name))return false; if(filters.category!=='all'&&!d.category.includes(filters.category))return false; if(filters.family&&!d.families.includes(filters.family))return false; if(filters.glassType&&getServeSpec(d).type!==filters.glassType)return false; if(filters.search){ const q=filters.search.toLowerCase(); if(!d.name.toLowerCase().includes(q))return false; } if(filters.ingredient){ const hasFixed=d.fixedIngredients.includes(filters.ingredient); const hasPour=d.pours&&d.pours.some(p=>p.picks.some(k=>k.n===filters.ingredient)); if(!hasFixed&&!hasPour)return false; } return true; }); }
function render(){ const list=visibleCards(); menuGrid.innerHTML=list.map(d=>cardHTML(d,CARDS.indexOf(d))).join(''); if(storyView)menuGrid.querySelectorAll('.drink-card').forEach(c=>c.classList.add('is-flipped')); updateActionBar(); const toast=document.getElementById('active-filter-toast'); if(filters.ingredient){ toast.querySelector('span').textContent='Showing: '+filters.ingredient; toast.classList.remove('hidden'); }else{ toast.classList.add('hidden'); } }
function updateActionBar(){ document.getElementById('action-favorites-btn').classList.toggle('is-active',filters.favesOnly); const active=filters.category!=='all'||filters.family||filters.ingredient||filters.glassType||filters.search; document.getElementById('action-filter-btn').classList.toggle('is-active-filter',!!active); document.getElementById('story-view-btn').classList.toggle('is-active',storyView); }

document.getElementById('active-filter-toast').onclick=()=>{ filters.ingredient=null; render(); };
menuGrid.addEventListener('click',e=>{ const favBtn=e.target.closest('.favorite-btn'); if(favBtn){ e.stopPropagation(); const n=favBtn.dataset.fav; const i=favorites.indexOf(n); if(i>-1)favorites.splice(i,1); else favorites.push(n); saveFaves(); favBtn.classList.toggle('is-favorite'); if(filters.favesOnly)render(); return; } const pslot=e.target.closest('.photo-slot'); if(pslot){ e.stopPropagation(); return; } const pclear=e.target.closest('.photo-clear'); if(pclear){ e.stopPropagation(); delete photos[pclear.dataset.clear]; savePhotos(); render(); return; } const toc=e.target.closest('.toc-item'); if(toc){ e.stopPropagation(); const cardIndex=toc.dataset.goto; if(filters.category!=='all'||filters.family||filters.favesOnly||filters.ingredient||filters.glassType||filters.search){ filters={category:'all',family:null,favesOnly:false,ingredient:null,glassType:null,search:''}; render(); } const card=menuGrid.querySelector('.drink-card[data-idx="'+cardIndex+'"]'); if(card){ menuGrid.querySelectorAll('.drink-card').forEach(c=>c.classList.remove('is-highlighted')); card.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); card.classList.add('is-highlighted'); setTimeout(()=>card.classList.remove('is-highlighted'),2000); } return; } const card=e.target.closest('.drink-card'); if(card)card.classList.toggle('is-flipped'); });
menuGrid.addEventListener('change',e=>{ const inp=e.target.closest('input[type=file][data-photo]'); if(!inp||!inp.files||!inp.files[0])return; const name=inp.dataset.photo; const r=new FileReader(); r.onload=()=>{ photos[name]=r.result; savePhotos(); render(); }; r.readAsDataURL(inp.files[0]); });
function snap(dir){ const cards=[...menuGrid.querySelectorAll('.drink-card')]; if(!cards.length)return; const r=menuGrid.getBoundingClientRect(); const mid=r.left+r.width/2; let best=0,min=Infinity; cards.forEach((c,i)=>{ const cr=c.getBoundingClientRect(); const dd=Math.abs(mid-(cr.left+cr.width/2)); if(dd<min){ min=dd; best=i; } }); const t=cards[Math.max(0,Math.min(cards.length-1,best+dir))]; if(t)t.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); }
document.getElementById('scroll-next-btn').onclick=()=>snap(1);
document.getElementById('scroll-prev-btn').onclick=()=>snap(-1);
document.getElementById('scroll-home-btn').onclick=()=>{ const f=menuGrid.querySelector('.drink-card'); if(f)f.scrollIntoView({behavior:'smooth',inline:'center'}); };
document.getElementById('story-view-btn').onclick=()=>{ storyView=!storyView; menuGrid.querySelectorAll('.drink-card').forEach(c=>c.classList.toggle('is-flipped',storyView)); updateActionBar(); };
document.getElementById('action-random-btn').onclick=()=>{ const cards=[...menuGrid.querySelectorAll('.drink-card:not([data-is-barcode])')]; if(!cards.length)return; const c=cards[Math.floor(Math.random()*cards.length)]; c.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}); c.classList.add('is-highlighted'); setTimeout(()=>c.classList.remove('is-highlighted'),2000); };

document.getElementById('action-view-btn').onclick=e=>{ isGrid=!isGrid; menuGrid.className=isGrid?'grid-view':'carousel-view'; const b=e.currentTarget; b.querySelector('span').textContent=isGrid?'Cards':'Grid'; b.querySelector('i').className=isGrid?'fas fa-rectangle-list':'fas fa-table-cells-large'; };
function openModal(id){ const m=document.getElementById(id); m.classList.remove('hidden'); requestAnimationFrame(()=>m.classList.remove('opacity-0')); }
function closeModal(id){ const m=document.getElementById(id); m.classList.add('opacity-0'); setTimeout(()=>m.classList.add('hidden'),300); }
['bar-stock-modal','filter-modal','favorites-modal'].forEach(id=>{ document.getElementById(id).addEventListener('click',e=>{ if(e.target.id===id)closeModal(id); }); });
document.getElementById('close-stock-btn').onclick=()=>closeModal('bar-stock-modal');

function renderStock(){ const el=document.getElementById('bar-stock-content'); el.innerHTML=Object.entries(ingredientCategories).map(([group,subs])=>'<div class="stock-group-title">'+group+'</div>'+Object.entries(subs).map(([sub,items])=>'<div class="stock-sub-title">'+sub+'</div><div class="grid grid-cols-2 sm:grid-cols-3 gap-2">'+items.map(i=>'<button class="stock-btn '+(inStock(i)?'in-stock':'')+'" data-ing="'+i+'"><i class="fas '+(inStock(i)?'fa-check':'fa-xmark')+'"></i><span>'+i+'</span></button>').join('')+'</div>').join('')).join(''); const n=MENU.filter(isMakeable).length; document.getElementById('stock-summary').textContent=n+' of '+MENU.length+" drinks pourable with what's on the shelf."; }
document.getElementById('bar-stock-content').addEventListener('click',e=>{ const b=e.target.closest('.stock-btn'); if(!b)return; const i=b.dataset.ing; barStock[i]=!inStock(i); saveStock(); renderStock(); render(); });
document.getElementById('stock-all-btn').onclick=()=>{ ALL_INGREDIENTS.forEach(i=>barStock[i]=true); saveStock(); renderStock(); render(); };
document.getElementById('stock-none-btn').onclick=()=>{ ALL_INGREDIENTS.forEach(i=>barStock[i]=false); saveStock(); renderStock(); render(); };
document.getElementById('action-stock-btn').onclick=()=>{ renderStock(); openModal('bar-stock-modal'); };
const CATEGORIES=['all','Brunch','Lunch','Dinner','Dessert'];
const FAMILIES=Object.keys(ingredientCategories.Spirits);
const CAT_ICON={all:'fa-layer-group',Brunch:'fa-mug-saucer',Lunch:'fa-sun',Dinner:'fa-moon',Dessert:'fa-ice-cream'};
const GLASS_TYPES=[{key:'shot',label:'Shots',icon:'fa-whiskey-glass'},{key:'shooter',label:'Shooters',icon:'fa-flask'},{key:'short',label:'Short Glass',icon:'fa-wine-glass'},{key:'tall',label:'Tall Glass',icon:'fa-bottle-droplet'},{key:'up',label:'Up / Coupe',icon:'fa-martini-glass'},{key:'warm',label:'Warm',icon:'fa-mug-hot'}];
function filterMatchCount(){ return visibleCards().filter(d=>!d.isBarcode).length; }
function updateApplyButton(){ const btn=document.getElementById('apply-filters-btn'); if(!btn)return; const n=filterMatchCount(); if(n===0){ btn.disabled=true; btn.textContent='No matches'; }else{ btn.disabled=false; btn.textContent='Show '+n+' '+(n===1?'drink':'drinks'); } }
function renderFilters(){ document.getElementById('filter-modal-content').innerHTML='<div class="filter-section"><input id="drink-search" type="search" placeholder="Search a drink by name..." value="'+(filters.search||'')+'" autocomplete="off"></div><div class="filter-section"><div class="filter-sheet-eyebrow">Glassware</div><div class="filter-row">'+GLASS_TYPES.map(g=>'<button class="filter-pill '+(filters.glassType===g.key?'is-active':'')+'" data-glass="'+g.key+'"><i class="fas '+g.icon+'"></i>'+g.label+'</button>').join('')+'</div></div><div class="filter-section"><div class="filter-sheet-eyebrow">Base Spirit</div><div class="filter-row">'+FAMILIES.map(f=>'<button class="filter-pill '+(filters.family===f?'is-active':'')+'" data-fam="'+f+'"><i class="fas '+(FAMILY_ICON[f]||['fa-wine-bottle'])[0]+'"></i>'+f+'</button>').join('')+'</div></div><div class="filter-section"><div class="filter-sheet-eyebrow">Time of Day</div><div class="filter-row">'+CATEGORIES.map(c=>'<button class="filter-pill '+(filters.category===c?'is-active':'')+'" data-cat="'+c+'"><i class="fas '+(CAT_ICON[c]||'fa-martini-glass')+'"></i>'+(c==='all'?'All':c)+'</button>').join('')+'</div></div><div class="filter-section"><div class="filter-sheet-eyebrow">Favorites</div><div class="filter-row"><button class="filter-pill '+(filters.favesOnly?'is-active':'')+'" data-faves="1"><i class="fas fa-heart"></i>Favorites only</button></div></div>'; const s=document.getElementById('drink-search'); if(s)s.addEventListener('input',ev=>{ filters.search=ev.target.value; updateApplyButton(); }); updateApplyButton(); }
document.getElementById('filter-modal-content').addEventListener('click',e=>{ const p=e.target.closest('.filter-pill'); if(!p)return; if(p.dataset.cat)filters.category=p.dataset.cat; if(p.dataset.fam)filters.family=(filters.family===p.dataset.fam)?null:p.dataset.fam; if(p.dataset.glass)filters.glassType=(filters.glassType===p.dataset.glass)?null:p.dataset.glass; if(p.dataset.faves)filters.favesOnly=!filters.favesOnly; filters.ingredient=null; renderFilters(); });
document.getElementById('reset-filters-btn').onclick=()=>{ filters={category:'all',family:null,favesOnly:false,ingredient:null,glassType:null,search:''}; renderFilters(); render(); };

const splash=document.getElementById('splash-screen');
splash.addEventListener('click',()=>{ splash.classList.add('is-hidden'); setTimeout(()=>splash.remove(),800); });
const SFX=(function(){ let ctx=null,master=null,noiseBuf=null,muted=false; function ensure(){ if(ctx)return; const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return; ctx=new AC(); master=ctx.createGain(); master.gain.value=0.9; master.connect(ctx.destination); const len=Math.floor(ctx.sampleRate*1.0); noiseBuf=ctx.createBuffer(1,len,ctx.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<len;i++)d[i]=Math.random()*2-1; } function resume(){ ensure(); if(ctx&&ctx.state==='suspended')ctx.resume(); } function partial(t,freq,gain,dur){ const o=ctx.createOscillator(); o.type='sine'; o.frequency.setValueAtTime(freq,t); const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(gain,t+0.004); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.03); } function clinkAt(t,vol,base){ partial(t,base,vol*0.9,0.30); partial(t,base*2.76,vol*0.5,0.18); partial(t,base*5.18,vol*0.26,0.10); const ns=ctx.createBufferSource(); ns.buffer=noiseBuf; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=6500; bp.Q.value=0.8; const g=ctx.createGain(); g.gain.setValueAtTime(vol*0.35,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.03); ns.connect(bp); bp.connect(g); g.connect(master); ns.start(t); ns.stop(t+0.05); } function clink(vol,base){ resume(); if(!ctx||muted)return; clinkAt(ctx.currentTime+0.005,vol||0.42,base||2100); } function tick(){ resume(); if(!ctx||muted)return; clinkAt(ctx.currentTime+0.005,0.24,3200); } function welcome(){ resume(); if(!ctx||muted)return; const t0=ctx.currentTime+0.03; const notes=[261.63,329.63,392.00,493.88,587.33]; notes.forEach((f,i)=>{ const t=t0+i*0.055; const o=ctx.createOscillator(); o.type='triangle'; o.frequency.value=f; const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2600; const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.3,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+1.5); o.connect(lp); lp.connect(g); g.connect(master); o.start(t); o.stop(t+1.6); }); clinkAt(t0+0.30,0.3,2600); } function shake(){ resume(); if(!ctx||muted)return; const t0=ctx.currentTime+0.02,shakes=6; for(let i=0;i<shakes;i++){ const t=t0+i*0.115; const ns=ctx.createBufferSource(); ns.buffer=noiseBuf; const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2500+(i%2?800:0); bp.Q.value=1.1; const g=ctx.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.012); g.gain.exponentialRampToValueAtTime(0.0001,t+0.09); ns.connect(bp); bp.connect(g); g.connect(master); ns.start(t); ns.stop(t+0.11); } clinkAt(t0+shakes*0.115+0.05,0.4,2000); } function toggleMute(force){ muted=(typeof force==='boolean')?force:!muted; if(master)master.gain.value=muted?0:0.9; return muted; } return { resume,clink,tick,welcome,shake,toggleMute }; })();
(function(){ splash.addEventListener('click',()=>SFX.welcome(),{once:true}); document.querySelectorAll('#action-bar .footer-btn, #footer-content .footer-btn').forEach(b=>{ b.addEventListener('click',()=>{ b.id==='action-random-btn'?SFX.shake():SFX.clink(); }); }); document.getElementById('filter-modal-content').addEventListener('click',e=>{ if(e.target.closest('.filter-pill'))SFX.tick(); }); document.getElementById('bar-stock-content').addEventListener('click',e=>{ if(e.target.closest('.stock-btn'))SFX.tick(); }); const st=document.getElementById('sound-toggle'); st.addEventListener('click',()=>{ const m=SFX.toggleMute(); st.classList.toggle('is-muted',m); st.querySelector('i').className=m?'fas fa-volume-xmark':'fas fa-volume-high'; if(!m)SFX.clink(0.4); }); })();
render();
</script>
</body>
</html>
